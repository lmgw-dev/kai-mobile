# The daemon's heap is capped at 4 GB and Gradle runs at most 6 workers (the build shares the
# machine); the Kotlin daemon has a heap of its own.
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.workers.max=6
org.gradle.parallel=true
org.gradle.caching=true
kotlin.daemon.jvmargs=-Xmx2g
android.useAndroidX=true
android.nonTransitiveRClass=true

# The app's version. The private CI's versionName is <kai.version>+<IID>, a public release's the plain
# <kai.version> (android/app/build.gradle.kts; scripts/release.sh sets it).
kai.version=0.1.1
